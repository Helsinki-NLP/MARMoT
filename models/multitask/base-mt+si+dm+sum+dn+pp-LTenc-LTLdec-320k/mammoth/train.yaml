   fra: /scratch/project_462001509/shared/MARMoT/tokenizer/tatoeba_hplt_multisynt/fra/32000/tokenizer.json
   ita: /scratch/project_462001509/shared/MARMoT/tokenizer/tatoeba_hplt_multisynt/ita/32000/tokenizer.json
   slv: /scratch/project_462001509/shared/MARMoT/tokenizer/tatoeba_hplt_multisynt/slv/32000/tokenizer.json

tgt_vocab:
   deu: /scratch/project_462001509/shared/MARMoT/tokenizer/tatoeba_hplt_multisynt/deu/32000/tokenizer.json
   eng: /scratch/project_462001509/shared/MARMoT/tokenizer/tatoeba_hplt_multisynt/eng/32000/tokenizer.json
   fra: /scratch/project_462001509/shared/MARMoT/tokenizer/tatoeba_hplt_multisynt/fra/32000/tokenizer.json
   ita: /scratch/project_462001509/shared/MARMoT/tokenizer/tatoeba_hplt_multisynt/ita/32000/tokenizer.json
   slv: /scratch/project_462001509/shared/MARMoT/tokenizer/tatoeba_hplt_multisynt/slv/32000/tokenizer.json

# Model Architecture Options
enc_layers: [3,3]
dec_layers: [2,2,2]

model_dim: 512
dropout: 0.1
model_dtype: bf16
add_language_tokens: false

heads: 8
rotary_pos_emb: true
post_emb_norm: true
attn_dropout: 0.1
ff_dropout: 0.1
ff_activation: swiglu

src_seq_length_min: 1
tgt_seq_length_min: 1
src_seq_length_max: 1024
tgt_seq_length_max: 1024
max_length: 1024

# Training Configuration
train_steps: 250000
early_stopping: 5
accum_count: [20]
lookahead_minibatches: 20
batch_size: 16384
batch_type: tokens
normalization: tokens
queue_size: 120

# Optimizer settings (from create_opts)
optim: adamw

learning_rate: 0.0003
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.01
max_grad_norm: 1.0
label_smoothing: 0.1

# Learning rate scheduling
warmup_steps: 1000
decay_method: linear_warmup
learning_rate_decay: 0.5
start_decay_steps: 10000
average_decay: 0

world_size: 24
gpu_ranks: [0,1,2,3,4,5,6,7]
n_nodes: 3
task_distribution_strategy: weighted_sampling
seed: 42

# Decoding parameters during validation
valid_batch_size: 16
valid_steps: 1000
valid_timeout: 300
valid_decode_timeout: 60
valid_max_length: 1024
valid_metrics: [bleu,chrf]
beam_size: 1

save_checkpoint_steps: 1000
keep_checkpoint: 1

# Logging and Monitoring

log_model_structure: false
tensorboard: true
tensorboard_log_dir: /pfs/lustrep2/scratch/project_462001509/members/tiedeman/MARMoT/models/multitask/base-mt+si+dm+sum+dn+pp-LTenc-LTLdec-320k/tb_logs
report_tflops: true
report_every: 250
report_training_accuracy: false
# Denoising transform parameters
denoising_objective: bart
mask_ratio: 0.2              # Fraction of tokens to mask
mask_length: span-poisson    # Options: "subword", "word", "span-poisson"
poisson_lambda: 3.0          # Lambda for span length distribution
replace_length: 1            # -1: keep N tokens, 0: remove all, 1: single mask per span


# Model saving
save_model: /pfs/lustrep2/scratch/project_462001509/members/tiedeman/MARMoT/models/multitask/base-mt+si+dm+sum+dn+pp-LTenc-LTLdec-320k/mammoth/model
save_strategy: best_and_last
reset_optim: none

add_language_tokens: false

heads: 4
rotary_pos_emb: true
post_emb_norm: true
attn_dropout: 0.1
ff_dropout: 0.1
ff_activation: swiglu

src_seq_length_min: 1
tgt_seq_length_min: 1
src_seq_length_max: 1024
tgt_seq_length_max: 1024
max_length: 1024

# Training Configuration
train_steps: 250000
early_stopping: 5
accum_count: [5]
lookahead_minibatches: 5
batch_size: 65536
batch_type: tokens
normalization: tokens
queue_size: 120


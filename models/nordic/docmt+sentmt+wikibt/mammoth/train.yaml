   dan: /scratch/project_462001509/shared/MARMoT/tokenizer/sent_doc/dan/32704/tokenizer.json
   eng: /scratch/project_462001509/shared/MARMoT/tokenizer/sent_doc/eng/32704/tokenizer.json
   fin: /scratch/project_462001509/shared/MARMoT/tokenizer/sent_doc/fin/32704/tokenizer.json
   nob: /scratch/project_462001509/shared/MARMoT/tokenizer/sent_doc/nob/32704/tokenizer.json
   swe: /scratch/project_462001509/shared/MARMoT/tokenizer/sent_doc/swe/32704/tokenizer.json

tgt_vocab:
   dan: /scratch/project_462001509/shared/MARMoT/tokenizer/sent_doc/dan/32704/tokenizer.json
   eng: /scratch/project_462001509/shared/MARMoT/tokenizer/sent_doc/eng/32704/tokenizer.json
   fin: /scratch/project_462001509/shared/MARMoT/tokenizer/sent_doc/fin/32704/tokenizer.json
   nob: /scratch/project_462001509/shared/MARMoT/tokenizer/sent_doc/nob/32704/tokenizer.json
   swe: /scratch/project_462001509/shared/MARMoT/tokenizer/sent_doc/swe/32704/tokenizer.json

# Model Architecture Options
enc_layers: [2,4]
dec_layers: [6]

model_dim: 1024
dropout: 0.1
model_dtype: bf16
add_language_tokens: false

heads: 16
rotary_pos_emb: true
post_emb_norm: true
attn_dropout: 0.1
ff_dropout: 0.1
ff_activation: swiglu

src_seq_length_min: 1
tgt_seq_length_min: 1
src_seq_length_max: 1024
tgt_seq_length_max: 1024
max_length: 1024

# Training Configuration
train_steps: 250000
early_stopping: 5
accum_count: [10]
lookahead_minibatches: 10
batch_size: 16384
batch_type: tokens
normalization: tokens
queue_size: 120

# Optimizer settings (from create_opts)
optim: adamw

learning_rate: 0.0003
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.01
max_grad_norm: 1.0
label_smoothing: 0.1

# Learning rate scheduling
warmup_steps: 1000
decay_method: linear_warmup
learning_rate_decay: 0.5
start_decay_steps: 10000
average_decay: 0

world_size: 8
gpu_ranks: [0,1,2,3,4,5,6,7]
n_nodes: 1
task_distribution_strategy: weighted_sampling
node_rank: 0
seed: 42

# Decoding parameters during validation
valid_batch_size: 16
valid_steps: 2500
valid_timeout: 300
valid_decode_timeout: 60
valid_max_length: 1024
valid_metrics: [bleu,chrf]
beam_size: 1

save_checkpoint_steps: 2500
keep_checkpoint: 1

# Logging and Monitoring

log_model_structure: false
tensorboard: true
tensorboard_log_dir: /pfs/lustrep2/scratch/project_462001509/members/tiedeman/MARMoT/models/nordic/docmt+sentmt+wikibt/tb_logs
report_tflops: true
report_every: 500
report_training_accuracy: false

# Model saving
save_model: /pfs/lustrep2/scratch/project_462001509/members/tiedeman/MARMoT/models/nordic/docmt+sentmt+wikibt/mammoth/model
save_strategy: best_and_last
reset_optim: none
